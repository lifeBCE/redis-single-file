#
# Github ruby gem build workflow
#
name: CI Ruby Gem Build
on: [pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build Ruby Gem
        run: gem build redis-single-file.gemspec
