#
# Github rspec unit test workflow
#
name: CI RSpec Tests
on: [pull_request]
permissions:
  contents: read
jobs:
  rspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
    services:
      redis:
        image: redis
        ports: ["6379:6379"]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run unit tests
      run: bundle exec rspec
